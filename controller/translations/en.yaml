---
configuration:
  server_host:
    name: Bind address
    description: >-
      Network address the controller listens on. Leave this as 0.0.0.0
      to listen on all container interfaces.
  server_ip:
    name: Controller LAN IP address
    description: >-
      The LAN IP address of this Home Assistant host. Echo devices are told
      to connect here, so it must be reachable from them. Leave empty to
      detect it automatically, which is correct unless this host has more
      than one network interface and devices are on a specific one. The
      address in use is logged at startup.
  mdns_name:
    name: mDNS service name
    description: >-
      The name advertised on your local network as
      <name>._emcontroller._tcp.local. Use lowercase letters, numbers, and
      hyphens.
  esphome_project_version:
    name: ESPHome project version
    description: >-
      Version reported to Home Assistant in the device's ESPHome info.
      Normally leave this at the default.
  esphome_port_base:
    name: ESPHome satellite base port
    description: >-
      First port used for the per-device Home Assistant satellites; Bluetooth
      proxies use this plus 1000. The stable and Early Access add-ons default
      to different bases so that a Home Assistant configuration entry left
      over from one can never reach a device belonging to the other. Changing
      this affects only devices added from now on — existing devices keep the
      port they were given.
  oww_model:
    name: Wake word model
    description: >-
      OpenWakeWord model to use, without the _v0.1.onnx suffix.
      For example: hey_jarvis.
  oww_threshold:
    name: Wake word sensitivity
    description: >-
      Detection threshold from 0 to 1. Lower values are more sensitive and
      may produce more false detections. The upstream default is 0.5.
  require_device_tls:
    name: Require encrypted device connections
    description: >-
      Reject device connections unless they use TLS and have a valid
      per-device token. Leave disabled until every device is shown as using
      wss (TLS) in the dashboard.
  device_approval:
    name: Device approval policy
    description: >-
      strict holds new devices for administrator approval. auto immediately
      approves new devices with a generated name.
  debug:
    name: Debug logging
    description: >-
      Log protocol-level detail for devices and the Home Assistant
      connection. Verbose — turn it on to diagnose something, then off
      again.
  log_levels:
    name: Per-area log levels
    description: >-
      Override the level of individual areas, as comma-separated
      name=LEVEL pairs. For example echomuse.esphome=DEBUG,
      aiohttp.access=INFO. Names follow the logger hierarchy, so
      echomuse=DEBUG covers every EchoMuse area and aiohttp.access covers
      the dashboard's own request log. Each name overrides the level set
      above it, so this can both add detail to one area and quiet another.
      Leave empty unless you are narrowing down a specific fault.
  extra_ca_cert:
    name: Private CA certificate
    description: >-
      Only needed if Home Assistant is served over HTTPS using your own
      internal certificate authority. Put the CA certificate (PEM format)
      in Home Assistant's ssl folder and enter /ssl/<filename> here.
      Without it, fetching the spoken response fails certificate
      verification and turns end with no audio.
  tts_wait_timeout:
    name: Reply wait (seconds)
    description: >-
      How long the controller waits for Home Assistant to start answering
      before it gives up on the turn, in seconds. Raise it if your
      conversation agent uses tools: such an agent legitimately needs longer
      than 30 seconds for a real question. When the wait ends, the Echo
      plays a short fallback tone. Above 120 is not accepted, because the
      ring stops showing that the Echo is working at 135 seconds.
  max_listen_ms:
    name: Max listen (milliseconds)
    description: >-
      How long the Echo keeps listening after speech starts. A noisy room
      can hold Home Assistant's voice activity detector open; this ends the
      turn anyway. 7000 is about one command. This is the fleet default. A
      Dot that overrides Advanced uses its own slider.
  trail_cutoff_ms:
    name: Trail cutoff (milliseconds)
    description: >-
      How long quiet or low-confidence audio may run before the turn ends.
      900 matches the speech gate's silence setting. This is the fleet
      default. A Dot that overrides Advanced uses its own slider.
  listen_confidence:
    name: Listen confidence
    description: >-
      The speech score that still counts as the person talking, from 0 to 1.
      Noise that keeps the microphone loud usually scores under 0.35, and
      the trail cutoff then ends the turn. This is the fleet default. A Dot
      that overrides Advanced uses its own slider.
  speech_gate_threshold:
    name: Speech gate score
    description: >-
      The Silero score that releases a turn's audio to Home Assistant,
      from 0.2 to 0.8. 0.5 is the score the gate has always used. A Dot
      that overrides Advanced uses its own slider. When a second-stage
      wake check accepts the wake and the best score reaches 0.25 but
      stays under this, the held audio is sent anyway. An empty
      transcript then ends quietly.
  loop_watchdog:
    name: Event-loop stall watchdog
    description: >-
      Off by default. When on, a stall longer than one second dumps the
      blocking stack and names the turn or upload that was running. The
      250 millisecond stall warning is unchanged.
  arbitration_mode:
    name: Wake arbitration mode
    description: >-
      shadow logs which Dot the nearest-Dot rule would pick and still
      answers with today's winner. nearest waits up to 600 milliseconds
      and answers on the calibrated loudest Dot. legacy is the 250
      millisecond hold alone. Set legacy and restart to roll back.
  arbitration_hold_ms:
    name: Arbitration hold (milliseconds)
    description: >-
      How long after the word was heard the nearest contest stays open.
      350. The contest also waits arbitration_min_wait_ms after the first
      claim arrives, and never longer than arbitration_cap_ms.
  arbitration_min_wait_ms:
    name: Arbitration minimum wait (milliseconds)
    description: >-
      How long to keep the contest open after the first claim arrives,
      even when the hold measured from when the word was heard has
      already run out. 150.
  arbitration_cap_ms:
    name: Arbitration cap (milliseconds)
    description: >-
      The contest decides no later than this many milliseconds after the
      first claim arrives. 600.
  arbitration_room_offsets_db:
    name: Room calibration offsets (dB)
    description: >-
      JSON map of Dot serial to a decibel offset. Empty means every
      offset is 0. The nearest rule adds the offset to that Dot's
      loudness before it picks.
  echo_margin_db:
    name: Echo margin (dB)
    description: >-
      A wake heard over playback, within this many dB of that Dot's
      playback level, is an echo. 6. It can win only when it is the only
      claim and its score reaches the solo minimum.
  echo_solo_min_score:
    name: Echo solo minimum score
    description: >-
      The wake score an echo-suspect Dot needs in order to answer when no
      other Dot heard the user well enough. 0.85. A second-stage accept
      can also keep that Dot. Otherwise nobody answers.
  arbitration_min_snr_db:
    name: Minimum SNR to take an echo handoff (dB)
    description: >-
      When the loudest Dot looks like its own playback, another Dot can
      take the turn only if its adjusted SNR is at least this, or its
      level is within the echo handoff margin. 2. Set this to 0 to hand
      the turn to any quieter Dot, which is the 2.26.8 rule.
  echo_handoff_margin_db:
    name: Echo handoff margin (dB)
    description: >-
      How close another Dot's level must be to an echo-flagged louder Dot
      before it can take the turn without meeting the minimum SNR. 6. A
      very large value restores the 2.26.8 handoff.
  arbitration_early_ms:
    name: Arbitration early exit (milliseconds)
    description: >-
      How long to wait for a second Echo after the first wake claim. 80
      grants a lone claim then. A second claim inside that window keeps
      the full 250 millisecond hold, so a louder Echo still wins. 0 waits
      out the whole hold. The wait is never longer than that hold.
  arb_score_mode:
    name: Arbitration score
    description: >-
      shadow logs a composite score (loudness, noise floor, wake score,
      arrival) beside the loudness winner. off leaves that log out. live
      gives the turn to the composite winner. The early exit and the hold
      stay as they are. shadow is the default.
  loser_cooldown_mode:
    name: Loser cooldown
    description: >-
      After a win, a losing Dot's claim inside the cooldown is logged as
      would_suppress. The turn still runs. live drops that claim. A wake
      score at or above the override, accepted by the second-stage checker,
      is left alone. log is the default.
  loser_cooldown_s:
    name: Loser cooldown (seconds)
    description: >-
      How long a losing Dot stays in the cooldown. 7 seconds. The range
      is 5 to 10.
  loser_override_wake:
    name: Cooldown override score
    description: >-
      A wake at or above this score whose checker returned accept skips
      the cooldown. 0.95.
  external_audio_gate:
    name: External audio gate
    description: >-
      log writes external_audio would_drop when the room's player is
      playing, the wake is at or under the faint level, and the speech
      gate never opens. live writes external_audio drop. The Home
      Assistant read waits 200 ms. A timeout or an error does not gate.
      log is the default.
  room_media_players:
    name: Room media players
    description: >-
      JSON map of Dot id to a Home Assistant media_player entity id.
      Empty maps nothing, and the external-audio read is not made.
  external_audio_faint_dbfs:
    name: Faint wake level (dBFS)
    description: >-
      A wake at or under this level can meet the external-audio rule.
      -40. Louder wakes are left alone.
  adaptive_endpoint:
    name: Adaptive endpoint
    description: >-
      Off by default. On, an explicit checker accept with early SNR under
      6 dB extends the no-speech window and lowers the speech-gate score
      by one step. The window stays within the Dot's max listen.
  adaptive_no_speech_ms:
    name: Adaptive no-speech (milliseconds)
    description: >-
      The no-speech window used when adaptive endpoint is on and its
      conditions are met. 3000. It does not shorten a longer window, and
      it does not pass the Dot's max listen.
  adaptive_vad_step:
    name: Adaptive speech-gate steps
    description: >-
      How many 0.05 steps to lower the speech-gate score when adaptive
      endpoint applies. 1. The score stays inside 0.2 to 0.8.
  no_reply_cue:
    name: Didn't-catch-that tone
    description: >-
      Play a short tone when a failed turn looks like a request. A clear
      transcript that names the assistant, speech after the action button,
      or a high wake score counts. Background chatter, a television, a low
      score, and no speech stay silent. The reason code is logged either
      way. On by default.
  cue_wake_score:
    name: Wake score for the tone
    description: >-
      A wake at or above this score counts as a real request, so the
      didn't-catch-that tone may play. 0.85 sits above the score that
      fires the wake word. A missing score stays silent.
  cue_min_words:
    name: Minimum words in a request
    description: >-
      A transcript can count as clear from this many words. The default
      is 2. The wake score can still count on its own.
  cue_min_chars:
    name: Minimum letters in a request
    description: >-
      A transcript can count as clear from this many letters. The default
      is 8. The wake score can still count on its own.
  cue_address:
    name: Extra names for the assistant
    description: >-
      Comma-separated phrases. A clear transcript that contains one of
      them counts as directed at the assistant. The device's own wake
      word is always included. Empty adds none. A phrase shorter than
      three letters is ignored.
  reply_fallback:
    name: Reply timeout tone
    description: >-
      Play a short tone when Home Assistant does not start answering within
      the reply wait. On by default.
  wake_verify_url:
    name: Second-stage wake check URL
    description: >-
      Optional. Leave empty to disable. When set, a streaming wake is sent
      here as JSON: device id, score, frame RMS, and about 1.5 seconds of
      audio (audio_wav_b64). The checker replies with {"accept": true} or
      {"accept": false}. Private listening is not sent, because that Echo
      does not stream audio before the wake word. The URL is yours; there
      is no default host.
  wake_verify_timeout_ms:
    name: Wake check timeout (milliseconds)
    description: >-
      How long to wait for the checker. 300 is the default. The wait
      overlaps multi-Echo arbitration. Above 2000 is not accepted.
  wake_verify_on_error:
    name: Wake check when the checker does not answer
    description: >-
      accept keeps the wake if the checker times out, cannot be reached,
      or returns something other than {"accept": true/false}. reject drops
      that wake. The default is accept, so a checker that is down does not
      silence the house.
