name: "EchoMuse"
# Tracks the published controller image tag, which controller-release.yml
# derives from the controller-v* tag (controller-v2.18.0 -> 2.18.0). Bump
# both together: Supervisor pulls `image:version`, so a version with no
# matching tag on GHCR fails to install.
version: "2.26.13"
# Pull the published multi-arch image rather than building on the user's
# machine. Without this Supervisor builds from this directory's Dockerfile,
# which downloads a few hundred MB on whatever the user runs Home Assistant
# on and cannot pass the EM_CONTROLLER_VERSION build arg — so the controller
# reports "dev" and the update notice goes quiet. controller-release.yml
# already publishes linux/amd64 and linux/arm64, matching the arch list below.
#
# The build does NOT compile anything, contrary to what this comment claimed
# until 2026-08-14: ffmpeg is apt, and onnxruntime, speexdsp-ns, scipy and
# scikit-learn all resolve to prebuilt wheels on this base image — see
# controller-release.yml, which relies on exactly that for its arm64 build.
# The distinction matters because a local build is the only way to test
# add-on changes before they reach main (Supervisor clones the default
# branch), and "it compiles onnxruntime" made that loop look far more
# expensive than it is. tools/make_dev_addon.sh packages one.
image: "ghcr.io/wilbowes/echomuse-controller"
# Supervisor stores this app's data at <apps-or-addons>/data/<repository>_<slug>
# (path_data). Current Supervisor uses apps/data and apps/local; older
# builds use addons/. The slug below stays "controller". The repository id
# is "local" for a local folder, and the first 8 hex characters of SHA-1 of
# the store URL for a git repository. https://github.com/wilbowes/EchoMuse
# is acc06409, so that install's directory is apps/data/acc06409_controller.
# A local build is apps/data/local_controller. Uninstall deletes whichever
# directory belongs to the app being removed. A local build does not share
# the git app's directory; tools/migrate_addon_data.sh copies the whole
# directory (database, tls/, oww_models/, firmware/) and refuses to start
# while the target is missing those. It also sets the original app's boot
# to manual so a reboot does not start both.
slug: "controller"
description: "Local, open-source voice assistant controller for rooted Echo Dot 2nd Gen devices — wake word, fleet dashboard, and Home Assistant integration via ESPHome."
url: "https://github.com/wilbowes/EchoMuse"
init: false
arch:
  - aarch64
  - amd64
# Required for mDNS controller discovery and the per-device ESPHome native
# API listeners (one TCP port per device, 16001+) — same reason the
# docker-compose deployment sets network_mode: host. Without it, devices on
# the LAN cannot find or connect to the controller.
host_network: true
ingress: true
ingress_port: 8768
# Admin-only sidebar entry. This is Supervisor's default, set explicitly
# because the dashboard authenticates whoever Home Assistant forwards
# (em_ingressauth) and proxies a root shell to every device — so a change to
# that default must not quietly widen who can reach it. Note it governs the
# menu entry; EchoMuse does not assume it gates the ingress URL, which is
# why only the FIRST Home Assistant user becomes admin and the rest are
# read-only until promoted.
panel_admin: true
panel_icon: mdi:microphone-message
panel_title: EchoMuse
environment:
  ECHOMUSE_HOME_ASSISTANT_INGRESS: "true"
  # /data is the add-on's own persistent storage, provided automatically by
  # Supervisor — fixed rather than a user option so the database can't be
  # pointed somewhere that doesn't survive a restart.
  DB_PATH: "/data/echomuse.db"
# Read-only access to Home Assistant's /ssl folder, so a private CA
# certificate can be pointed at with extra_ca_cert. Read-only by default,
# which is all this needs — we copy the file, never write it.
map:
  - type: ssl
  # Stage install writes wake-arbitration.jsonl under /share/leo/logs.
  - type: share

options:
  server_host: "0.0.0.0"
  server_ip: ""
  mdns_name: "echomuse"
  esphome_project_version: "2.0.0"
  # Base for the per-device ESPHome satellite ports. Differs per release
  # channel so the two add-ons hand out disjoint ranges — see em_db's
  # ESPHOME_PORT_BASE and sync_channels.py, which rewrites this line.
  esphome_port_base: 16001
  oww_model: "hey_jarvis"
  # Keep in step with em_db.DEFAULT_DEVICE_CONFIG["owwThreshold"] — a fresh
  # add-on install is precisely the case that default exists for, and
  # test_addon_default_threshold_matches_the_controller pins the pair.
  oww_threshold: 0.5
  require_device_tls: false
  device_approval: "strict"
  debug: false
  # Per-logger level overrides, as comma-separated name=LEVEL pairs:
  # "echomuse.esphome=DEBUG,aiohttp.access=INFO". Applied on top of the
  # level `debug` sets, so a name here wins over it. Empty leaves every
  # logger alone. A pair naming something that is not a logger is reported
  # in the log and skipped rather than refused.
  log_levels: ""
  # Path to a PEM CA certificate to trust, for a Home Assistant served
  # over HTTPS with a private CA. Put the file in Home Assistant's /ssl
  # folder and give the path as /ssl/<filename>.
  extra_ca_cert: ""
  # Seconds to wait for Home Assistant's reply to begin before the turn is
  # given up (#805). 30 is not a safety net for a tool-using conversation
  # agent — a question needing a few model round-trips crosses it in ordinary
  # use. When the wait ends the Echo plays a short fallback tone
  # (reply_fallback). Raise the wait if yours needs longer. The ceiling is
  # the thinking ring's own dead-man (em_scenes.SPIN_TTL, 135s) less a
  # margin: past that the ring goes idle while the controller is still waiting.
  tts_wait_timeout: 30
  # Fleet defaults for the listen cap. A Dot that overrides Advanced uses
  # its own sliders. max_listen_ms is measured after speech starts.
  max_listen_ms: 7000
  trail_cutoff_ms: 900
  listen_confidence: 0.35
  # Silero score that releases a turn's audio to Home Assistant. 0.5 is
  # the score the gate has always used. A Dot that overrides Advanced
  # uses speechGateThreshold. A wake the second-stage checker accepts,
  # whose best score reaches 0.25 and stays under this, is sent anyway.
  speech_gate_threshold: 0.5
  # Off: the 250ms stall warning is unchanged, and no stack is dumped.
  # On: a stall over 1s dumps the blocking stack and names the turn or
  # upload that was running.
  loop_watchdog: false
  # Milliseconds a lone wake claim waits for a second Echo. 80 grants it
  # then. A second claim inside that window keeps the 250ms hold, so a
  # louder Echo still in the old window wins. 0 waits out the whole hold.
  arbitration_early_ms: 80
  # shadow logs the nearest-Dot winner and still grants today's winner.
  # nearest waits for a late claim and grants the calibrated loudest Dot.
  # legacy is the 250 ms hold with no nearest log. Roll back with legacy.
  arbitration_mode: "shadow"
  arbitration_hold_ms: 350
  arbitration_min_wait_ms: 150
  arbitration_cap_ms: 600
  arbitration_room_offsets_db: ""
  echo_margin_db: 6
  echo_solo_min_score: 0.85
  # A non-echo claim takes a louder echo-flagged Dot only at this adjusted
  # SNR, or within echo_handoff_margin_db of that Dot's level. 0 and a very
  # large handoff margin restore the 2.26.8 handoff.
  arbitration_min_snr_db: 2
  echo_handoff_margin_db: 6
  # A suspect claim with no playback reference that leads the best clean
  # claim by more than this, and scores at echo_solo_min_score, stays in
  # the contest. Below it the handoff stands.
  echo_override_db: 10
  # Milliseconds after this Dot's own playback ends during which a wake
  # is still "over playback". A barge flag later than this is ignored.
  playback_tail_ms: 500
  # A lone claim leaves at arbitration_early_ms only when its SNR is at
  # least this and it is not an echo. Below the bar the contest waits out
  # the hold. Off restores the arrival-based early exit.
  arbitration_early_snr_gate: true
  arbitration_early_min_snr_db: 8
  # After a grant, a late claim at least this many dB clearer takes the
  # turn until the pipeline starts or this many milliseconds pass.
  # Off leaves a late claim as a loser.
  arbitration_takeover: true
  arbitration_takeover_max_ms: 250
  arbitration_takeover_margin_db: 6
  # A second Dot starting the same wake phrase inside this many seconds
  # waits out Home Assistant's duplicate-wake cooldown. The earlier
  # pipeline is cancelled when it has no transcript. Off starts immediately.
  ha_wake_cooldown: true
  ha_wake_cooldown_s: 2.05
  # Shadow logs a composite wake score beside the loudness winner.
  # off leaves the contest alone. live uses the composite as the winner.
  # The 80 ms early exit and the 250 ms hold stay as they are.
  arb_score_mode: "shadow"
  # After a win, a losing Dot's later claim inside this window is logged.
  # log writes would_suppress and still runs the turn. live drops the
  # claim. A wake score at or above loser_override_wake whose checker
  # returned accept is left alone. off records nothing.
  loser_cooldown_mode: "log"
  loser_cooldown_s: 7
  loser_override_wake: 0.95
  # A faint wake in a room whose mapped player is playing, with the speech
  # gate never opening, is logged. log writes external_audio would_drop.
  # live writes external_audio drop. The Home Assistant read waits 200 ms
  # and a timeout or error does not gate. off does not read.
  external_audio_gate: "log"
  room_media_players: ""
  external_audio_faint_dbfs: -40
  # Off. On, an explicit checker accept with early SNR under 6 dB extends
  # the no-speech window up to adaptive_no_speech_ms, capped by the
  # Dot's max listen, and lowers the speech-gate score by one step.
  adaptive_endpoint: false
  adaptive_no_speech_ms: 3000
  adaptive_vad_step: 1
  # A short tone when a failed turn looks like a request from the family.
  # A clear transcript that names the assistant or follows the action
  # button, or a wake score at or above cue_wake_score. Chatter, a
  # television, a low score, and no speech stay silent. The reason code
  # is logged either way.
  no_reply_cue: true
  cue_wake_score: 0.85
  cue_min_words: 2
  cue_min_chars: 8
  cue_address: ""
  # A short tone when the reply wait above expires.
  reply_fallback: true
  # Second-stage wake check. Empty disables it: nothing is posted and the
  # wake path does not wait. The URL is the operator's checker (no default
  # host). A streaming wake POSTs about 1.5s of pre-roll plus score, device
  # id and RMS, and waits for {"accept": true} or {"accept": false}.
  wake_verify_url: ""
  wake_verify_timeout_ms: 300
  # accept: a timeout or an error still wakes. reject: drop the wake.
  wake_verify_on_error: "accept"
  # Shared with the add-on that installs a wake model on chosen Dots.
  # Empty disables POST /api/internal/oww_install. The value is compared
  # and then discarded; it is not logged and it does not grant any other
  # route.
  internal_install_secret: ""
schema:
  server_host: "str"
  server_ip: "str"
  mdns_name: "match(^[a-z0-9][a-z0-9-]{0,62}$)"
  esphome_project_version: "str"
  esphome_port_base: "int(1024,60000)"
  oww_model: "str"
  oww_threshold: "float(0,1)"
  require_device_tls: "bool"
  device_approval: "list(strict|auto)"
  debug: "bool"
  log_levels: "str"
  extra_ca_cert: "str?"
  tts_wait_timeout: "int(5,120)"
  max_listen_ms: "int(2000,20000)"
  trail_cutoff_ms: "int(200,3000)"
  listen_confidence: "float(0,1)"
  speech_gate_threshold: "float(0.2,0.8)"
  loop_watchdog: "bool"
  arbitration_early_ms: "int(0,250)"
  arbitration_mode: "list(legacy|shadow|nearest)"
  arbitration_hold_ms: "int(0,2000)"
  arbitration_min_wait_ms: "int(0,2000)"
  arbitration_cap_ms: "int(50,5000)"
  arbitration_room_offsets_db: "str?"
  echo_margin_db: "float(0,40)"
  echo_solo_min_score: "float(0,1)"
  arbitration_min_snr_db: "float(0,40)"
  echo_handoff_margin_db: "float(0,80)"
  echo_override_db: "float(0,80)"
  playback_tail_ms: "int(0,5000)"
  arbitration_early_snr_gate: "bool"
  arbitration_early_min_snr_db: "float(0,80)"
  arbitration_takeover: "bool"
  arbitration_takeover_max_ms: "int(0,2000)"
  arbitration_takeover_margin_db: "float(0,40)"
  ha_wake_cooldown: "bool"
  ha_wake_cooldown_s: "float(0,10)"
  arb_score_mode: "list(off|shadow|live)"
  loser_cooldown_mode: "list(off|log|live)"
  loser_cooldown_s: "int(5,10)"
  loser_override_wake: "float(0,1)"
  external_audio_gate: "list(off|log|live)"
  room_media_players: "str?"
  external_audio_faint_dbfs: "float(-90,-5)"
  adaptive_endpoint: "bool"
  adaptive_no_speech_ms: "int(500,15000)"
  adaptive_vad_step: "int(0,5)"
  no_reply_cue: "bool"
  cue_wake_score: "float(0,1)"
  cue_min_words: "int(1,20)"
  cue_min_chars: "int(1,80)"
  cue_address: "str?"
  reply_fallback: "bool"
  wake_verify_url: "str"
  wake_verify_timeout_ms: "int(50,2000)"
  wake_verify_on_error: "list(accept|reject)"
  internal_install_secret: "password?"
